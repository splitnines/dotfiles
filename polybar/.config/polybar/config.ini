[bar/main]
monitor = ${env:MONITOR}

height = 24
fixed-center = true

override-redirect = true
wm-restack = i3

background = #000000
foreground = #abb2bf

font-0 = "JetBrainsMono Nerd Font:size=12;3"
font-1 = "JetBrainsMono Nerd Font:size=12;3"
font-2 = "Noto Sans Symbols:size=13;3"

modules-left = i3
modules-center = date weather
modules-right = reboot recording cpu disk memory battery volume mic tray

enable-ipc = true
strip-wsnumbers = true

[bar/main-secondary]
monitor = ${env:MONITOR}

height = 24
fixed-center = true

override-redirect = true
wm-restack = i3

background = #000000
foreground = #abb2bf

font-0 = "JetBrainsMono Nerd Font:size=11;3"
font-1 = "JetBrainsMono Nerd Font:size=11;3"
font-2 = "Noto Sans Symbols:size=12;3"

modules-left = i3
modules-center = date weather
modules-right = reboot recording cpu disk memory volume mic

enable-ipc = true
strip-wsnumbers = true

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
wrapping-scroll = false
pin-workspaces = true
format-padding = 1

label-focused = %{T2}%name%%{T-}
label-focused-foreground = #000000
label-focused-background = #5c6370
label-focused-padding = 1

label-visible = %{T2}%name%%{T-}
label-visible-foreground = #5c6370
label-visible-background = #000000
label-visible-padding = 1

label-unfocused = %{T2}%name%%{T-}
label-unfocused-foreground = #5c6370
label-unfocused-background = #000000
label-unfocused-padding = 1

label-urgent = %{T2}%name%%{T-}
label-urgent-foreground = #e06c75
label-urgent-background = #000000
label-urgent-padding = 1

strip-wsnumbers = true

[module/date]
type = custom/script
exec = date '+%a %d %b %H:%M' | tr '[:upper:]' '[:lower:]'
interval = 1
label-font = 1
label = %output%
click-left = env GTK_THEME=Pinentry-OneDark /usr/bin/gsimplecal

[module/cpu]
type = internal/cpu
interval = 2
label = %{T2}%{F#626977}c%{F-} %percentage%%{T-}
format-padding = 1

[module/disk]
type = internal/fs
mount-0 = /
label-mounted = %{T2}%{F#626977}d%{F-} %percentage_used%%{T-}
format-padding = 1

[module/memory]
type = internal/memory
interval = 2
label = %{T2}%{F#626977}m%{F-} %percentage_used%%{T-}
format-padding = 1

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
poll-interval = 1
format-discharging = %{O50px}<label-discharging>
label-discharging = %{F#626977}B %{F-}%percentage%
format-charging =
format-full =
format-padding = 3

[module/volume]
type = custom/script
exec = ~/.config/polybar/volume.sh
interval = 1
format = <label>
format-padding = 3

[module/mic]
type = custom/script
exec = wpctl get-volume @DEFAULT_AUDIO_SOURCE@ | grep -q MUTED && printf '%%{F#626977}m\314\266i\314\266c\314\266%%{F-}\n' || echo ""
interval = 1
format-padding = 2
click-left = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
scroll-up = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
scroll-down = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

[module/tray]
type = internal/tray
format-padding = 2

[module/weather]
type = custom/script
exec = ~/.local/bin/weather
interval = 30
label-font = 1
format-padding = 3
click-left = ~/.local/bin/weather-select

[module/recording]
type = custom/script
exec = ~/.local/bin/ffrecord-status
tail = true
format = <label>
format-padding = 1

[module/reboot]
type = custom/script
exec = ~/.local/bin/checkreboot
interval = 5
format-foreground = #ff0000
format-padding = 1
click-left = ~/.local/bin/ffrecord
