# ===========================
# Environment repair
# ===========================
set-option -g update-environment "DISPLAY SSH_AUTH_SOCK SSH_ASKPASS SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"

# ===========================
# General Options
# ===========================
set-option -g mouse on
set-option -g renumber-windows on
set-option -g history-limit 50000
set-option -g base-index 1
set-option -g pane-base-index 1
set-option -g extended-keys on
set-option -g extended-keys-format csi-u
set-option -g cursor-style blinking-bar
set-option -g repeat-time 1000

# ===========================
# Terminal image support
# ===========================
set-option -g default-terminal "${TERM}"
set-option -g allow-passthrough all
set-option -ag terminal-features ",*:RGB"

# ===========================
# Key Mode Settings
# ===========================
set-option -g status-keys vi
set-window-option -g mode-keys vi

# ===========================
# Reload config
# ===========================
bind-key Escape source-file $HOME/.config/tmux/tmux.conf

# ===========================
# Session key bindings
# ===========================
bind-key Tab switch-client -n
bind-key BTab switch-client -p
bind-key N new-session
bind-key K confirm-before -p "Kill session #S? (y/n)" kill-session

# ===========================
# Appearance: Status Bar
# ===========================
set-option -g status on
set-option -g status-bg "#282c34"
set-option -g status-fg "#abb2bf"
set-option -g status-interval 1

set-option -g status-position top
set-option -g status-right "#[fg=#5c6370,bg=#282c34] [#S:#H]"

# ===========================
# Window Titles
# ===========================
set-window-option -g window-status-format "#[fg=#5c6370,bg=#282c34] #I:#W #[default]"
set-window-option -g window-status-current-format "#[fg=#98c739,bg=#282c34] #I:#W #[default]"
set-window-option -g window-status-last-style "fg=#5c6370,bg=#e5c07b"
set-option -g message-style "bg=#282c34,fg=#abb2bf,fill=#282c34"
set-option -g message-command-style "bg=#282c34,fg=#abb2bf,fill=#282c34"
set-option -g mode-style "bg=#c678dd,fg=#282c34"

# ===========================
# Pane Borders
# ===========================
set-option -g pane-border-style "fg=#5c6370"
set-option -g pane-active-border-style "fg=#61afef"
set-option -g pane-border-lines single

# ===========================
# Pane Management
# ===========================
unbind-key x
unbind-key r
bind-key x confirm-before -p "Kill current pane? (y/n)" "kill-pane"
bind-key r confirm-before -p "Respawn current pane? (y/n)" "respawn-pane -k"

# ===========================
# Balance the panes
# ===========================
bind-key F9 select-layout even-horizontal
bind-key F10 select-layout even-vertical

# ===========================
# Swap window position
#============================
bind-key F11 swap-window -d -t :-
bind-key F12 swap-window -d -t :+

# ===========================
# Window navigation
# ===========================
bind-key -r n next-window
bind-key -r p previous-window

# ===========================
# Vim-style Pane Navigation
# ===========================
bind-key -r h if-shell -F '#{==:#{pane_at_left},0}'   'select-pane -L'
bind-key -r j if-shell -F '#{==:#{pane_at_bottom},0}' 'select-pane -D'
bind-key -r k if-shell -F '#{==:#{pane_at_top},0}'    'select-pane -U'
bind-key -r l if-shell -F '#{==:#{pane_at_right},0}'  'select-pane -R'

# ===========================
# Mouse and Scroll Behavior
# ===========================
bind-key -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" \
  "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind-key -n WheelDownPane select-pane -t= \; send-keys -M
bind-key -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M
bind-key -T copy-mode-vi C-WheelUpPane send-keys -X halfpage-up
bind-key -T copy-mode-vi C-WheelDownPane send-keys -X halfpage-down

bind-key m set-option -g mouse

# ===========================
# Window and Pane Management
# ===========================
unbind-key %
bind-key '\' run-shell "tmux split-window -h -c \"$(tmux display -p -F '#{pane_current_path}')\""
unbind-key '"'
bind-key '-' run-shell "tmux split-window -v -c \"$(tmux display -p -F '#{pane_current_path}')\""

# ==========================
# All pane mode
# ==========================
unbind -T root C-a
unbind -T copy-mode C-a
unbind -T prefix C-a
unbind C-a
bind-key a set-window-option synchronize-panes

# ===========================
# Pop-Up Window
# ===========================
bind-key t display-popup -E -w 60% -h 80% -d "#{pane_current_path}" "tmux new-session -A -s Tmp"

# ===========================
# Display clock
# ===========================
bind-key T clock-mode

# ===========================
# Plugins
# ===========================
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# run to install the plugin: prefix + I
set-environment -g TMUX_PLUGIN_MANAGER_PATH '/home/rickey/.local/share/tmux/plugins/'

set-option -g @plugin 'tmux-plugins/tpm'
set-option -g @plugin 'tmux-plugins/tmux-yank'
set-option -g @plugin 'tmux-plugins/tmux-resurrect'
set-option -g @plugin 'tmux-plugins/tmux-continuum'

set-option -g @continuum-save-interval '15'
set-option -g @continuum-restore 'off'
set-option -g @resurrect-processes 'nvim ssh'

run-shell '/home/rickey/.local/share/tmux/plugins/tpm/tpm'

# ===========================
# Copy and Clipboard Integration
# ===========================
unbind-key -T copy-mode-vi Enter
unbind-key -T copy-mode-vi MouseDragEnd1Pane
set-option -g mode-keys vi
set-option -g set-clipboard on
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind-key -n MouseDown2Pane run-shell -b 'xclip -selection clipboard -out | tmux load-buffer - \; paste-buffer'
